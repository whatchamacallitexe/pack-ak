<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rayman</title>
<style>
body { overflow: hidden; background: #000; margin: 0; }
#startButton { display: block; width: 160px; height: 40px; background-color: #4CAF50; color: white; text-align: center; font-size: 16px; margin: 20px auto; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }

<div style="width: 100vw; height: 100vh;">
<div id="game" style="display: none;"></div>
<button id="startButton">PLAY</button>
</div>
<script>
document.getElementById("startButton").addEventListener("click", function() {
  document.getElementById("game").style.display = "block";
  document.getElementById("startButton").style.display = "none";
  EJS_player = "#game";
  EJS_core = "jaguar";
  EJS_color = "#000000";
  EJS_startOnLoaded = true;
  EJS_pathtodata = "../_shared/emu/";
  EJS_gameUrl = "assets/cdn/62cf21d2-Rayman_World_.zip";
  var script = document.createElement("script");
  script.src = "../_shared/6515c3799bdb-loader.js";
  document.body.appendChild(script);
});
</script>
</body>
</html>
